# Deskcel (Hostcel): gera o executável portátil para Windows x64 com a marca e o servidor da Hostcel.
# Passos copiados do job build-for-windows-flutter de flutter-build.yml (só x64, sem assinatura e sem MSI).
name: Deskcel Windows portatil

on:
  workflow_dispatch:

env:
  DESKCEL_SERVER: "desck.hostcel.com.br"
  DESKCEL_KEY: ${{ secrets.DESKCEL_KEY }}  # chave pública do servidor, cópia em F:/backup-deskcel/CHAVE-PRIVADA/rustdesk-server/id_ed25519.pub
  DESKCEL_NAME: "Deskcel"
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-deskcel:
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      # hbb_common é submódulo do upstream: o nome, o servidor e a chave são trocados aqui.
      - name: Marca Deskcel (nome, servidor e chave)
        shell: bash
        run: |
          python3 - <<'EOF'
          import os, re
          p = "libs/hbb_common/src/config.rs"
          s = open(p, encoding="utf-8").read()
          subs = [
              (r'APP_NAME: RwLock<String> = RwLock::new\("RustDesk"', f'APP_NAME: RwLock<String> = RwLock::new("{os.environ["DESKCEL_NAME"]}"'),
              (r'RENDEZVOUS_SERVERS: &\[&str\] = &\["rs-ny\.rustdesk\.com"\]', f'RENDEZVOUS_SERVERS: &[&str] = &["{os.environ["DESKCEL_SERVER"]}"]'),
              (r'RS_PUB_KEY: &str = "[^"]+"', f'RS_PUB_KEY: &str = "{os.environ["DESKCEL_KEY"]}"'),
          ]
          assert os.environ["DESKCEL_KEY"], "segredo DESKCEL_KEY vazio"
          for pat, rep in subs:
              s, n = re.subn(pat, rep, s)
              assert n == 1, f"padrão não encontrado: {pat}"
          open(p, "w", encoding="utf-8").write(s)
          EOF
          grep -n "APP_NAME: RwLock\|RENDEZVOUS_SERVERS:\|RS_PUB_KEY:" libs/hbb_common/src/config.rs

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        shell: bash
        run: |
          cp "$(find . -name Runner.res | head -1)" ./libs/portable/Runner.res

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./out
          mv ./target/release/rustdesk-portable-packer.exe ./out/Deskcel.exe

      - name: Conferir versao
        shell: powershell
        run: |
          (Get-Item .\out\Deskcel.exe).VersionInfo | Format-List ProductName,FileDescription,CompanyName
          & .\rustdesk\rustdesk.exe --version

      - name: Upload Deskcel.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Deskcel-windows-x64
          path: ./out/Deskcel.exe
          if-no-files-found: error

      # Abre o programa no runner e fotografa a janela, para comparar com o modelo.
      - name: Foto da janela principal
        continue-on-error: true
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class W { [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
            public struct R { public int L, T, Ri, B; } }
          "@
          [W]::SetProcessDPIAware() | Out-Null
          $p = Start-Process .\rustdesk\rustdesk.exe -PassThru
          Start-Sleep 40
          $w = Get-Process | Where-Object { $_.MainWindowHandle -ne 0 -and $_.ProcessName -eq 'rustdesk' } | Select-Object -First 1
          mkdir fotos -Force | Out-Null
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("fotos\tela-inteira.png")
          if ($w) {
            [W]::SetForegroundWindow($w.MainWindowHandle) | Out-Null; Start-Sleep 2
            $r = New-Object W+R; [W]::GetWindowRect($w.MainWindowHandle, [ref]$r) | Out-Null
            "janela: $($r.L),$($r.T) $($r.Ri - $r.L)x$($r.B - $r.T)" | Tee-Object fotos\janela.txt
            $c = New-Object System.Drawing.Bitmap ($r.Ri - $r.L), ($r.B - $r.T)
            $g2 = [System.Drawing.Graphics]::FromImage($c); $g2.CopyFromScreen($r.L, $r.T, 0, 0, $c.Size)
            $c.Save("fotos\janela-principal.png")
          }

      - name: Upload das fotos
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fotos
          path: ./fotos
          if-no-files-found: ignore
